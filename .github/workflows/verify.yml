name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            macos:
              - 'macos/**'
              - 'scripts/verify.sh'
              - 'scripts/package-macos.sh'
              - 'scripts/package-release.sh'
              - 'scripts/ci-build-macos-release.sh'
              - 'scripts/launch.sh'
              - 'scripts/generate-app-icon.sh'
              - 'scripts/macos-release-inputs-changed.sh'
              - '.github/workflows/verify.yml'
              - '.github/workflows/release-macos.yml'
              - 'skills/macos/**'

  verify-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server typecheck, tests, and production build
        working-directory: server
        run: |
          npm run typecheck
          npm run test
          npm run build

  verify-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: jdx/mise-action@v2

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run macOS and full-stack pre-push checks
        run: ./scripts/verify.sh
