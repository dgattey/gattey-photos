name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run pre-push checks
        run: ./scripts/verify.sh
