# Build a signed macOS release and publish it as a GitHub Release (zip + Sparkle appcast.xml) on the pushed commit.
# Nothing is pushed back to main: photos.gattey.com redirects /appcast.xml to the latest release's appcast.
# Only runs when macOS or packaging inputs change (not site-only server edits).
name: release-macos

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'scripts/package-macos.sh'
      - 'scripts/package-release.sh'
      - 'scripts/ci-build-macos-release.sh'
      - 'scripts/macos-release-inputs-changed.sh'
      - 'scripts/export-ci-secrets.sh'
      - 'scripts/lib/signing.sh'
      - 'scripts/next-release-version.sh'
      - 'scripts/setup-self-signed-cert.sh'
      - 'scripts/fetch-previous-appcast.sh'
      - 'scripts/release-notes.sh'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Decide whether to rebuild the macOS app
        id: macos
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          released="$(git tag --points-at HEAD --list 'v*')"
          if [[ -n "$released" ]]; then
            echo "release-macos: $GITHUB_SHA is already released as $released"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif ./scripts/macos-release-inputs-changed.sh; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package macOS release
        if: steps.macos.outputs.build == 'true'
        id: package
        env:
          GATTEY_CODESIGN_P12_BASE64: ${{ secrets.GATTEY_CODESIGN_P12_BASE64 }}
          GATTEY_CODESIGN_P12_PASSWORD: ${{ secrets.GATTEY_CODESIGN_P12_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          GATTEY_RELEASE_TYPE: ${{ inputs.release_type }}
        run: ./scripts/ci-build-macos-release.sh

      - name: Publish GitHub release
        if: steps.macos.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "dist/release/Gattey-Photos-${VERSION}.zip" \
            dist/release/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "Gattey Photos ${VERSION}" \
            --notes-file "dist/release/Gattey-Photos-${VERSION}.html"

      - name: Check the latest release serves the new appcast
        if: steps.macos.outputs.build == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
            | grep -F "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
