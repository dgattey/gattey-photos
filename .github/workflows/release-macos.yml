# Build a signed macOS release and commit server/public/ for Vercel Git deploys.
# Only runs when macOS or packaging inputs change (not site-only server edits).
name: release-macos

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'scripts/package-macos.sh'
      - 'scripts/package-release.sh'
      - 'scripts/ci-build-macos-release.sh'
      - 'scripts/macos-release-inputs-changed.sh'
      - 'scripts/export-ci-secrets.sh'
      - 'scripts/lib/signing.sh'
      - 'scripts/next-release-version.sh'
      - 'scripts/setup-self-signed-cert.sh'
      - 'scripts/fetch-live-macos-release.sh'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Decide whether to rebuild the macOS app
        id: macos
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if ./scripts/macos-release-inputs-changed.sh; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package macOS release
        if: steps.macos.outputs.build == 'true'
        id: package
        env:
          GATTEY_CODESIGN_P12_BASE64: ${{ secrets.GATTEY_CODESIGN_P12_BASE64 }}
          GATTEY_CODESIGN_P12_PASSWORD: ${{ secrets.GATTEY_CODESIGN_P12_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          GATTEY_RELEASE_TYPE: ${{ inputs.release_type }}
        run: ./scripts/ci-build-macos-release.sh

      - name: Commit and push release artifacts
        if: steps.macos.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/public/
          if git diff --staged --quiet; then
            echo "release-macos: no changes to server/public — skipping commit"
            exit 0
          fi
          git commit -m "Release v${{ steps.package.outputs.version }}"
          git push
